[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-failure-circuit-breaker"
version = "2.0.1"
description = "CircuitBreaker AI: Autonomous Engine Loop Interception & Infinite Recursion Trap"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
long-horizon-failure-circuit-breaker = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/long-horizon-failure-circuit-breaker"
Repository = "https://github.com/abusuraihsakhri/long-horizon-failure-circuit-breaker.git"

[tool.setuptools]
py-modules = ["cli", "circuit_breaker_app", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "circuit_breaker*"]
