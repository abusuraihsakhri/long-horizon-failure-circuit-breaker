name: Python and Browser Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q agents circuit_breaker cli.py enrichment.py simulator.py
      - name: Run Python tests
        env:
          AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
        run: python -m pytest -q
      - name: Verify packaged CLI
        env:
          AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
        run: long-horizon-failure-circuit-breaker verify-audit
      - name: Check and test static browser evaluator
        run: |
          node --check web/app.js
          node --test tests/browser.test.cjs
